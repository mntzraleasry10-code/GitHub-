<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحاسبة الأولى</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #edf1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      width: 300px;
      padding: 20px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 8px 25px #0002;
    }

    h2 {
      text-align: center;
      color: #263238;
    }

    #display {
      width: 100%;
      box-sizing: border-box;
      height: 65px;
      margin-bottom: 15px;
      padding: 12px;
      font-size: 28px;
      text-align: left;
      direction: ltr;
      border: 1px solid #ccd3db;
      border-radius: 10px;
      background: #f7f9fb;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #display.error {
      font-size: 16px;
      color: #c62828;
      text-align: right;
      direction: rtl;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 55px;
      font-size: 21px;
      border: none;
      border-radius: 10px;
      background: #e5eaf0;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .operator { background: #d6e8ff; }
    .clear    { background: #ffd9d9; }
    .equal    { background: #167d58; color: white; }
    .equal    { grid-row: span 2; }
    .zero     { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>حاسبتي</h2>

    <input id="display" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="backspace()">⌫</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    let currentNum = "0";     
    let prevNum = null;       
    let op = null;            
    let startNewNum = true;   
    let isError = false;      

    function updateDisplay() {
      if (isError) return;

      if (op !== null && prevNum !== null) {
        let symbol = op;
        if (op === "*") symbol = "×";
        if (op === "/") symbol = "÷";
        if (op === "-") symbol = "−";
        
        let currentPart = startNewNum ? "" : currentNum;
        display.value = prevNum + " " + symbol + " " + currentPart;
      } else {
        display.value = currentNum;
      }
    }

    function appendNumber(num) {
      if (isError) clearDisplay();

      if (startNewNum) {
        currentNum = num === "." ? "0." : num;
        startNewNum = false;
      } else {
        if (num === "." && currentNum.includes(".")) return;
        
        if (currentNum === "0" && num !== ".") {
          currentNum = num;
        } else {
          currentNum += num;
        }
      }
      updateDisplay();
    }

    function chooseOperator(selectedOp) {
      if (isError) clearDisplay();

      if (op !== null && prevNum !== null && !startNewNum) {
        let res = compute(Number(prevNum), Number(currentNum), op);
        if (res === null) return;
        currentNum = String(res);
      }
      
      prevNum = currentNum;
      op = selectedOp;
      startNewNum = true;
      updateDisplay();
    }

    function calculate() {
      if (isError) return;
      if (op === null || prevNum === null) return;

      let secondNum = startNewNum ? Number(prevNum) : Number(currentNum);
      let res = compute(Number(prevNum), secondNum, op);
      
      if (res === null) return;

      currentNum = String(res);
      prevNum = null;
      op = null;
      startNewNum = true;
      updateDisplay();
    }

    function compute(n1, n2, operation) {
      let res;
      switch (operation) {
        case "+": res = n1 + n2; break;
        case "-": res = n1 - n2; break;
        case "*": res = n1 * n2; break;
        case "/":
          if (n2 === 0) { setError("لا يمكن القسمة على صفر"); return null; }
          res = n1 / n2; break;
        default: return null;
      }
      return Number(res.toPrecision(12));
    }

    function setError(msg) {
      display.value = msg;
      display.classList.add("error");
      isError = true;
      prevNum = null;
      op = null;
      currentNum = "0";
      startNewNum = true;
    }

    function clearDisplay() {
      display.value = "0";
      display.classList.remove("error");
      isError = false;
      currentNum = "0";
      prevNum = null;
      op = null;
      startNewNum = true;
    }

    // 🔥 هذا هو الجزء اللي تم إصلاحه بالكامل 🔥
    function backspace() {
      if (isError) { clearDisplay(); return; }

      // إذا كان هناك عملية وضغطت حذف قبل كتابة الرقم الثاني، نلغي العملية ونرجع الرقم الأول
      if (op !== null && startNewNum) {
        currentNum = prevNum;
        prevNum = null;
        op = null;
        startNewNum = false;
      } else {
        // إذا كنا نكتب رقماً (أو ناتج حساب)، نحذف آخر رقم
        if (currentNum.length > 1) {
          currentNum = currentNum.slice(0, -1);
        } else {
          currentNum = "0";
        }
      }
      updateDisplay();
    }
  </script>
</body>
</html>
